[pytest]
testpaths = tests

# Put the repository root on sys.path so `lottery`, `football` and `core` are
# importable from the tests.
#
# Without this, a bare `pytest` fails at conftest import while `python -m pytest`
# succeeds: the `-m` form prepends the working directory to sys.path and the
# console script does not. Everything here was developed with `python -m pytest`,
# so the difference stayed invisible until CI ran `pytest` and every job died
# with `ModuleNotFoundError: No module named 'lottery'`. Setting it here fixes
# both invocations rather than making CI a special case.
pythonpath = .
markers =
    slow: end-to-end runs that fit real models (deselect with '-m "not slow"')
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
