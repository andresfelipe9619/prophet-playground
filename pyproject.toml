# Project metadata and tool configuration.
#
# Dependencies still live in requirements.txt / requirements-test.txt; moving
# them here is item 2 of docs/superpowers/plans/2026-09-19-platform-roadmap.md.
# This file exists first because ruff and mypy need somewhere to be configured.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-playground"
version = "0.1.0"
description = "Forecasting and evaluation over Baloto, football and cycling, each against a baseline named in advance."
requires-python = ">=3.11"
# Read from requirements.txt rather than restated here. That file already
# carries the reasoning for what is in it (and the note about the CPU torch
# wheel), and a second list that *can* diverge from the first eventually does
# -- which has happened in this repository before, when a hosted build silently
# offered five models where the local one offered six.
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.test = { file = ["requirements-test.txt"] }

[tool.setuptools]
# A collection of packages run in place, not a library anyone installs; listing
# them stops setuptools guessing and failing on the data and docs directories.
packages = ["core", "lottery", "football", "cycling", "dashboard", "scripts"]

[tool.ruff]
# 120, not the more usual 88 or 100. This codebase carries most of its reasoning
# in prose -- long explanatory comments and docstrings, plus the dashboard's
# Spanish copy strings, which must not be wrapped mid-sentence. Measured, the
# code sits at p50=46 and p95=97 characters, so a limit exists to catch a
# runaway line, not to reflow deliberate prose: at 100 there are 454 violations,
# nearly all of them sentences; at 120 there are 15 and every one is a genuinely
# over-long line of code.
line-length = 120
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes. I: import order. UP: py311-era syntax.
# B: bugbear, which is the only one of the five that finds real defects --
# mutable default arguments and loop-variable capture, both of which are
# silent-wrong rather than loud-wrong in a numerics codebase.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# E402: Streamlit re-executes the script top to bottom on every interaction, so
# the dashboard's import-then-call order is load-bearing and E402 reads it as a
# mistake. E501: these modules are mostly Spanish copy strings, and a sentence
# broken across lines to satisfy a linter is harder to review for meaning --
# which is the only thing that matters about them.
"dashboard/*.py" = ["E402", "E501"]
# The original matplotlib/seaborn script, superseded by the dashboard and kept
# as-is; see CLAUDE.md. Not worth reformatting, but it still gets the rules that
# find defects rather than style.
"scripts/summary_charts.py" = ["E501"]

[tool.mypy]
# Scoped to core/ deliberately. It is ~150 lines of domain-free numerics, which
# makes strict mode achievable, and it is the one package where a wrong type is
# silently wrong rather than loud: a z-test handed the wrong shape returns a
# number, not an error. The domain packages pass DataFrames through every
# signature and would need a large ignore list to say very little.
files = ["core"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
# The four library packages, and deliberately not `dashboard/` or `scripts/`.
# Those are the Streamlit UI and the CLI entry points: pytest never imports
# them, the `static` CI job byte-compiles them, and the dashboard's real check
# is a browser (docs/development.md §3.3). Measuring them would report ~1,500
# statements of untested surface and invite the wrong fix -- unit tests around
# st.* calls -- instead of the Playwright pass that actually catches a broken
# page.
source = ["core", "lottery", "football", "cycling"]
omit = [
    # prophet is not in requirements-test.txt by design, so this module cannot
    # be imported in CI at all. Leaving it measured reports a permanent 0% that
    # no test is allowed to fix, which reads as neglect rather than as a
    # decision. The decision is documented in requirements-test.txt.
    "lottery/models/prophet_model.py",
    # Legacy top-level scripts with no functions: they do their work on import,
    # which means "covering" them would mean running them. Kept for existing
    # local workflows (docs/development.md), superseded for everything else.
    "lottery/utils/csv_merger.py",
    "lottery/utils/lib_detector.py",
]

[tool.coverage.report]
# Measured at 92.6%. The floor is set just under that rather than at the 80%
# it needs to clear, because a gate thirteen points below the real number
# permits thirteen points of silent rot -- which is the only thing the gate
# exists to stop. Two points of slack absorb a line moving; a drop past that is
# a module that arrived without tests, and CI should say so.
#
# It is a floor, never a target. What this project needs from its suite is the
# invariants listed in CLAUDE.md -- the things a refactor breaks silently -- and
# no coverage number can tell whether those are pinned. Raise this when the
# measured number rises; do not lower it to make a red build green.
fail_under = 90
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    # argparse wiring under `python -m`. The `static` job byte-compiles every
    # one of these, and what they do is exercised through the functions they
    # call; a test that drove them would be testing argparse.
    "if __name__ == .__main__.:",
    # The lazy `import torch` / `import timesfm` paths guard themselves with
    # these, and CI installs neither (see lottery/models/timesfm_model.py,
    # whose invariants are pinned through an injected stub forecaster instead).
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
